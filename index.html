 if(Math.random()<ch)startG(f,o,s?"ground":"clinch");else{f.stam=Math.max(0,f.stam-6);f.st="hit";f.hs=.5;f.mv=null;f.e=0;msg(s?"¡Derribo defendido!":"¡Se zafa!",900)}}
function startG(top,bot,type){const g={type,top,bot,t:6,esc:0,sub:0,cd:0,at:.3};G.g=g;top.g=bot.g=g;top.st=bot.st="grp";top.mv=bot.mv=null;top.e=bot.e=0;if(type=="ground")toGround(g);else msg("¡Clinch!",900)}
function toGround(g){g.type="ground";g.t=12;g.esc=0;g.sub=0;g.px=(g.top.x+g.bot.x)/2;g.pz=(g.top.z+g.bot.z)/2;g.yaw=Math.atan2(g.top.x-g.bot.x,g.top.z-g.bot.z);msg("¡Al suelo!",1100);snd(55,.25,.8);shake=.2}
function endG(){const g=G.g;if(!g)return;if(g.type=="ground"){g.bot.x=g.px;g.bot.z=g.pz;g.top.x=g.px+Math.sin(g.yaw)*1.1;g.top.z=g.pz+Math.cos(g.yaw)*1.1}else{const d=dist(g.top,g.bot)||1;g.bot.x+=(g.bot.x-g.top.x)/d*.5;g.bot.z+=(g.bot.z-g.top.z)/d*.5}
 [g.top,g.bot].forEach(f=>{f.g=null;f.st="idle";f.mv=null;f.e=0;f.cd=.5});G.g=null}
function gdmg(f,o,d){const sh=K[KB[o.pi].blk]?.5:1,dm=d*(.6+.8*f.d.st.pow)*(.8+.2*f.stam/100)*sh*(1.2-.4*o.d.st.chin);o.hp-=dm;f.pts+=dm;f.rpts+=dm;spark(o.x,.4,o.z);snd(80,.1,.5);shake=.08;if(o.hp<=0)ko(o,f,"¡TKO!")}
function gpress(f,a){const g=f.g;if(!g)return;const o=f===g.top?g.bot:g.top;
 if(f===g.top){if(g.cd>0)return;
  if(a=="jab"||a=="cross"){const k=a=="cross";g.cd=.28;f.gs=.28;f.gi=k?1:0;gdmg(f,o,g.type=="ground"?(k?6:4):(k?4:3))}
  else if(a=="knee"&&g.type=="clinch"){g.cd=.5;f.gs=.3;f.gi=0;gdmg(f,o,9)}
  else if(a=="shoot"&&g.type=="clinch"){g.cd=.6;if(Math.random()<.5+.4*(f.d.st.gr-o.d.st.gr))toGround(g);else msg("¡Proyección defendida!",900)}
  else if(a=="clinch"&&g.type=="ground"){g.sub+=.1*(.5+f.d.st.gr)*(1+f.d.sb);f.stam=Math.max(0,f.stam-1)}}
 else if(/^(fwd|back|up|dn|blk)$/.test(a)){g.esc+=.075*(.5+f.d.st.gr);g.sub=Math.max(0,g.sub-.03)}}
function ko(o,w,t){if(G.phase!="fight")return;G.phase="over";o.st="ko";o.kt=0;o.mv=null;if(G.g){const g=G.g;g.top.g=g.bot.g=null;G.g=null;w.st="idle"}G.ts=.3;msg(t,2500);setTimeout(()=>{G.ts=1;over(w,t)},2200)}
function tap(g){const o=g.bot,w=g.top;G.phase="over";o.st="tap";w.g=o.g=null;G.g=null;w.st="idle";msg("¡SUMISIÓN!",2500);snd(300,.3,.5);setTimeout(()=>over(w,"Victoria por sumisión"),2200)}
function over(w,t){$("et").textContent=w?"¡"+w.d.n.toUpperCase()+" GANA!":"EMPATE";$("ed").textContent=(w?"Jugador "+(w.pi+1)+" · ":"")+t.replace(/[¡!]/g,"");$("end").style.display="grid"}
// IA
function updG(dt){const g=G.g;if(!g)return;g.t-=dt;g.cd-=dt;g.sub=Math.max(0,g.sub-.06*dt);g.esc=Math.max(0,g.esc-.1*dt);g.at-=dt;
g.top.stam=Math.min(100,g.top.stam+3*dt);if(g.type=="ground"){g.top.pts+=.7*dt;g.top.rpts+=.7*dt}
 if(g.sub>=1){tap(g);return}if(g.esc>=1||g.t<=0){msg(g.esc>=1?"¡Escapa!":"Los árbitros los ponen de pie",1100);endG()}}
// bucle de lucha
function upd(f,o,dt,T){f.cd-=dt;f.dodge-=dt;f.cnt-=dt;if(f.buf)f.buf[1]-=dt;f.gs=Math.max(0,f.gs-dt);if(f.st=="ko"){f.kt+=dt;return}if(f.st=="tap")return;
 if(f.stam<100&&f.st!="grp")f.stam=Math.min(100,f.stam+(f.st=="idle"?10:4)*(.6+.8*f.d.st.card)*dt);f.leg=Math.max(0,f.leg-.01*dt);
 if(f.st=="grp"){f.spd=0;return}
 const dx=o.x-f.x,dz=o.z-f.z,dd=Math.hypot(dx,dz)||1,ux=dx/dd,uz=dz/dd;
 const ty=Math.atan2(dx,dz);let df=((ty-f.yaw+9.4248)%6.2832)-3.1416;f.yaw+=df*Math.min(1,dt*10);
 f.blocking=false;let sp=0;
 if(f.st=="atk"){const m=f.mv,d=MV[m.id];m.t+=dt;f.e=m.t<d.su?m.t/d.su:m.t<d.su+d.ac?1:1-(m.t-d.su-d.ac)/d.rc;
  if(!m.done&&m.t>=d.su){m.done=1;resolve(f,o,d)}if(m.t>=d.su+d.ac+d.rc){f.st="idle";f.mv=null;f.e=0}}
 else if(f.st=="hit"){f.hs-=dt;if(f.hs<=0){f.st="idle";f.rk=0}}
 else if(f.st=="spr"){f.sprl-=dt;if(f.sprl<=0)f.st="idle"}
 else if(f.st=="chk"){f.chk-=dt;if(f.chk<=0)f.st="idle"}
 else if(f.st=="down"){f.dn-=dt;if(f.dn<=0){f.st="idle";f.cd=.3}}
 else if(f.st=="idle"){const B=KB[f.pi],I={mf:(K[B.fwd]?1:0)-(K[B.back]?1:0),mc:((K[B.up]?1:0)-(K[B.dn]?1:0))*(f.pi?-1:1),blk:K[B.blk]};if(f.buf){const b=f.buf;f.buf=null;if(b[1]>0)act(f,b[0])}
  f.blocking=!!I.blk&&f.stam>0;const s=2.7*(.7+.5*f.d.st.spd)*(1-f.leg*.5)*(f.stam<20?.7:1)*(f.blocking?.4:1);
  if(f.dodge<=0){f.x+=(ux*I.mf+uz*I.mc)*s*dt;f.z+=(uz*I.mf-ux*I.mc)*s*dt;sp=Math.min(1,Math.hypot(I.mf,I.mc)*s/3)}}
 f.spd=lerp(f.spd,sp,.2);f.ph+=dt*9*f.spd}
function pose(f,T){const m=f.m,mv=f.mv?MV[f.mv.id]:null,e=f.e||0,g=f.g;
 let sx=[-.95,-.95],ex=[-1.9,-1.9],sz=[-.12,.12],tx=0,ty=0,tz=0,hy=.9,hr=0,th=[-.25,.3],kn=[.35,.55];
 const w=Math.sin(f.ph)*.55*f.spd;th[0]+=w;th[1]-=w;hy+=Math.sin(T*3)*.02-.04;
 if(f.blocking){sx=[-1.25,-1.25];ex=[-2.5,-2.5];sz=[-.35,.35];tx=.25;hy-=.05}
 if(f.dodge>0){tx=-.45;hy-=.1}
 if(f.st=="atk"&&mv){const i=mv.l,t=mv.t;
  if(t=="p"||t=="c"){sx[i]=lerp(-.95,-1.55,e);ex[i]=lerp(-1.9,-.05,e);ty=(i?.6:-.25)*e}
  else if(t=="h"){sx[i]=-1.45;ex[i]=lerp(-1.9,-1.4,e);sz[i]=lerp(.1,-1.1,e);ty=-.8*e}
  else if(t=="u"){sx[i]=lerp(-.5,-2.5,e);ex[i]=-.9;ty=.4*e;hy-=.12*(1-e)}
  else if(t=="k"){th[i]=lerp(0,-mv.a,e);kn[i]=lerp(1.7,.05,e);tx=-mv.b*e;kn[1-i]=.15}
  else if(t=="n"){th[i]=lerp(0,-1.75,e);kn[i]=lerp(.5,2,e);tx=.2*e}
  else if(t=="g"){hy-=.3*e;tx=1*e;sx=[-1.6,-1.6];ex=[-.3,-.3];th[0]=-.9*e;kn[0]=1.2*e}}
 if(f.st=="hit"){tx=-.4*Math.min(1,f.hs*3);if(f.rk){tz=Math.sin(T*10)*.25;hy-=.12}}if(f.st=="spr"){hy=.55;tx=1;sx=[-.3,-.3];ex=[-.3,-.3];th=[.5,.7]}if(f.st=="chk"){th[0]=-1.35;kn[0]=1.8;tx=-.1}
 let root=[f.x,0,f.z],rr=[0,f.yaw,0];
 if(g){const top=f===g.top,e2=f.gs/.28;
  if(g.type=="clinch"){tx=.3;hy-=.12;sx=[-1.45,-1.45];ex=[-.9,-.9];if(top&&f.gs>0){sx[f.gi]=-1.9*(.5+.5*e2)}}
  else if(top){root=[g.px+Math.sin(g.yaw)*.4,0,g.pz+Math.cos(g.yaw)*.4];rr=[0,g.yaw+Math.PI,0];tx=.9;hy=.58;th=[-1.2,-1.2];kn=[2,2];sx=[-1,-1];ex=[-1,-1];if(f.gs>0){sx[f.gi]=-1.9;ex[f.gi]=-.1}}
  else{root=[g.px+Math.sin(g.yaw)*.85,.25,g.pz+Math.cos(g.yaw)*.85];rr=[-Math.PI/2,g.yaw,0];th=[-1.1,-1.1];kn=[1.6,1.6];sx=[-1.3,-1.3];ex=[-1,-1]}}
 if(f.st=="ko"||f.st=="tap"||f.st=="down"){const k=f.st=="down"?Math.min(1,f.dn*2):Math.min(1,f.kt*2.5);rr=[-k*Math.PI/2,f.yaw,0];root[1]=.2*k;th=[0,0];kn=[0,0];sx=[0,0];ex=[0,0];hy=.9}
 m.root.position.set(root[0],root[1],root[2]);m.root.rotation.set(rr[0],rr[1],rr[2]);m.hips.position.y=hy;m.hips.rotation.y=hr;m.torso.rotation.set(tx,ty,tz);
 for(let i=0;i<2;i++){m.sh[i].rotation.set(sx[i],0,sz[i]);m.el[i].rotation.x=ex[i];m.th[i].rotation.x=th[i];m.kn[i].rotation.x=kn[i]}}
function bars(){[[P1,1],[P2,2]].forEach(([f,i])=>{$("hp"+i).style.width=Math.max(0,f.hp)+"%";$("sp"+i).style.width=f.stam+"%"})}
function startRound(n){G.round=n;G.time=60;G.phase="fight";F.forEach((f,i)=>{f.x=i?2:-2;f.z=0;f.st="idle";f.mv=null;f.g=null;f.e=0;f.stam=100;f.leg=0;f.hs=0;f.rk=0;f.kdn=0;f.dn=0;f.hp=Math.min(100,f.hp+(n>1?12:0))});G.g=null;$("rd").textContent="Asalto "+n+" / "+G.rounds;msg(n==1?"¡A PELEAR!":"ASALTO "+n,1200);bell()}
function card(){const a=P1.rpts,b=P2.rpts,d=Math.abs(a-b),w=d<4?0:a>b?1:2,s=w==0?[10,10]:d>45?(w==1?[10,8]:[8,10]):(w==1?[10,9]:[9,10]);P1.rpts=P2.rpts=0;return s}
function endRound(){if(G.phase!="fight")return;if(G.g)endG();const s=card();G.cards.push(s);bell();
 if(G.round<G.rounds){G.phase="between";msg("Fin del asalto "+G.round+" · "+s[0]+"–"+s[1],2300);setTimeout(()=>startRound(G.round+1),2800)}
 else{G.phase="over";const A=G.cards.reduce((x,c)=>x+c[0],0),B=G.cards.reduce((x,c)=>x+c[1],0);msg("Decisión de los jueces",1800);setTimeout(()=>over(A==B?null:A>B?P1:P2,"Tarjetas "+G.cards.map(c=>c.join("-")).join(" · ")+" · total "+A+"-"+B),2200)}}
function begin(){F.forEach(f=>sc.remove(f.m.root));P1=mk(FT[sel],-2,0);P2=mk(FT[+$("opp").value],2,1);F=[P1,P2];G.cards=[];G.rounds=+$("nr").value;$("n1").textContent="J1 · "+P1.d.n;$("n2").textContent="J2 · "+P2.d.n;$("menu").style.display="none";$("end").style.display="none";$("hud").style.display="block";$("ctl").classList.add("show");setTimeout(()=>$("ctl").classList.remove("show"),9000);AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(!crowd.g)crowd();startRound(1)}
// UI
FT.forEach((d,i)=>{const b=document.createElement("button");b.className="card"+(i==0?" on":"");b.innerHTML="<b>"+d.n+"</b><small>"+d.s+"</small><div class='st'>"+Object.keys(SL).map(k=>"<span>"+SL[k]+"</span><i style='width:"+d.st[k]*100+"%'></i>").join("")+"</div>";b.onclick=()=>{sel=i;[...document.querySelectorAll(".card")].forEach((c,j)=>c.classList.toggle("on",j==i))};$("cards").appendChild(b)});
$("opp").innerHTML=FT.map((d,i)=>"<option value='"+i+"'>"+d.n+"</option>").join("");$("opp").value=1;
$("go").onclick=begin;$("again").onclick=begin;$("tomenu").onclick=()=>{$("end").style.display="none";$("hud").style.display="none";$("menu").style.display="grid";G.phase="menu"};
addEventListener("keydown",e=>{K[e.code]=1;if(/^(Space|Arrow|Tab)/.test(e.code))e.preventDefault();if(e.code=="KeyH"&&G.phase!="menu")$("ctl").classList.toggle("show");if(G.phase!="fight"||e.repeat)return;[0,1].forEach(i=>{const a=KM[i][e.code];if(!a)return;const f=F[i];if(f.g){gpress(f,a);return}press(f,a)})});
addEventListener("keyup",e=>K[e.code]=0);
// bucle
let last=performance.now();
function loop(t){requestAnimationFrame(loop);const rd=Math.min((t-last)/1000,.05);last=t;let dt=rd*G.ts;const T=t/1000;if(G.hs>0){G.hs-=rd;dt=0}if(crowd.g)crowd.g.gain.value=Math.max(.03,crowd.g.gain.value-rd*.05);
 if(G.phase=="menu"){orb+=rd*.2;cam.position.set(Math.sin(orb)*9,2.4,Math.cos(orb)*9);cam.lookAt(0,1.1,0);spot.position.x=0;REF.root.visible=false;if(F.length)F.forEach(f=>f.m.root.visible=false)}
 else{F.forEach(f=>f.m.root.visible=true);
  if(G.phase=="fight"){G.time-=dt;if(G.time<=0)endRound();updG(dt)}
  if(G.phase=="fight"||G.phase=="over")F.forEach((f,i)=>upd(f,F[1-i],dt,T));
  const a=P1,b=P2,dd=dist(a,b);if(dd<.75&&!G.g){const p=(.75-dd)/2,ux=(b.x-a.x)/(dd||1),uz=(b.z-a.z)/(dd||1);a.x-=ux*p;a.z-=uz*p;b.x+=ux*p;b.z+=uz*p}
  F.forEach(f=>{const r=Math.hypot(f.x,f.z);if(r>6.3){f.x*=6.3/r;f.z*=6.3/r}f.m.sk.color.copy(f.m.sk0).lerp(RED,Math.min(.55,(1-f.hp/100)*.6+(1-f.stam/100)*.12));f.m.sk.roughness=.6-.3*(1-f.stam/100);pose(f,T)});
  const gg=G.g&&G.g.type=="ground"?{x:G.g.px,z:G.g.pz}:{x:(a.x+b.x)/2,z:(a.z+b.z)/2};let rx=b.x-a.x,rz=b.z-a.z;const n=Math.hypot(rx,rz)||1;rx/=n;rz/=n;cr.x=lerp(cr.x,rx,.06);cr.z=lerp(cr.z,rz,.06);const cn=Math.hypot(cr.x,cr.z)||1,fx=cr.z/cn,fz=-cr.x/cn,cd=cl(5.4+dd*.9,6,9.5);
  shake=Math.max(0,shake-dt*.6);cam.position.set(gg.x-fx*cd+(Math.random()-.5)*shake,2.1+dd*.08+(Math.random()-.5)*shake,gg.z-fz*cd);cam.lookAt(gg.x,1.1,gg.z);REF.root.visible=true;REF.root.position.set(gg.x+fx*2.6,0,gg.z+fz*2.6);REF.root.rotation.y=Math.atan2(-fx,-fz);REF.sh[0].rotation.x=-.4;REF.sh[1].rotation.x=G.phase=="over"?-2.8:-.4;REF.el[0].rotation.x=REF.el[1].rotation.x=-.3;REF.th[0].rotation.x=REF.th[1].rotation.x=0;REF.hips.position.y=.9;
  $("tm").textContent=Math.max(0,Math.ceil(G.time));bars();const g=G.g;$("gm").style.display=g?"block":"none";
  if(g){$("gl").textContent=g.type=="ground"?"J"+(g.top.pi+1)+" arriba: golpes y sumisión · J"+(g.bot.pi+1)+" abajo: machaca movimiento/bloqueo":"Clinch: J"+(g.top.pi+1)+" domina (golpes cortos, rodilla, proyección)";$("gs").style.width=cl(g.sub,0,1)*100+"%";$("ge").style.width=cl(g.esc,0,1)*100+"%"}}
 SP.forEach(s=>{if(s.l>0){s.l-=rd;s.m.scale.setScalar(Math.max(.01,s.l*3));s.m.position.y+=rd*.8;if(s.l<=0)s.m.visible=false}});
 ren.render(sc,cam)}
requestAnimationFrame(loop);
})();
